<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/main}">

<body>
    <th:block layout:fragment="content">
    
    <section class="chocolate_section layout_padding">
      <div class="container">
        <div class="heading_container text-center mb-5">
          <h2>Danh mục sản phẩm</h2>
          <p>Tất cả sản phẩm trong danh mục</p>
        </div>
      </div>
      <div class="container">
        <div class="row">
            <!-- Shop Sidebar Start -->
            <div class="col-lg-3 col-md-12 mb-4">
                <div class="border p-4 bg-light">
                    <h5 class="font-weight-bold mb-3">Lọc theo giá</h5>
                    <form>
                        <div class="custom-control custom-checkbox mb-2">
                            <input type="checkbox" class="custom-control-input" id="price-all" checked>
                            <label class="custom-control-label" for="price-all">Tất cả</label>
                        </div>
                        <div class="custom-control custom-checkbox mb-2">
                            <input type="checkbox" class="custom-control-input" id="price-1">
                            <label class="custom-control-label" for="price-1">Dưới 500k</label>
                        </div>
                        <div class="custom-control custom-checkbox mb-2">
                            <input type="checkbox" class="custom-control-input" id="price-2">
                            <label class="custom-control-label" for="price-2">500k - 1Tr</label>
                        </div>
                    </form>
                </div>
            </div>
            
            <div class="col-lg-9 col-md-12">
                <div class="row">
                  <div class="col-sm-6 col-md-6 col-lg-4" th:each="i : ${products}">
                    <div class="product_box">
                      <a th:href="@{'/' + ${i.categoryUrl} + '/' + ${i.id}}">
                         <img th:src="@{${i.image}}" alt="" class="img-fluid w-100">
                      </a>
                      <h5 th:text="${i.name}">Product Name</h5>
                      <h6 th:text="${i.price != null ? #numbers.formatDecimal(i.price, 0, 'COMMA', 0, 'POINT') : '0'} + ' VNĐ'">$5.0</h6>
                      <div class="d-flex justify-content-center mt-3">
                        <a th:href="@{'/' + ${i.categoryUrl} + '/' + ${i.id}}" class="btn btn-sm btn-outline-secondary mr-2">Chi tiết</a>
                        <a href="#" class="btn btn-sm btn-dark btnAddToCart" th:data-id="${i.id}" th:data-price="${i.price}">Thêm vào giỏ</a>
                      </div>
                    </div>
                  </div>
                  
                  <!-- Pagination -->
                  <div class="col-12 mt-4" th:if="${products != null and not #lists.isEmpty(products)}">
                      <nav aria-label="Page navigation">
                        <ul class="pagination justify-content-center">
                          <li class="page-item disabled"><a class="page-link" href="#">Previous</a></li>
                          <li class="page-item active"><a class="page-link" href="#">1</a></li>
                          <li class="page-item"><a class="page-link" href="#">2</a></li>
                          <li class="page-item"><a class="page-link" href="#">Next</a></li>
                        </ul>
                      </nav>
                  </div>
                  <div class="col-12 text-center mt-4" th:if="${products == null or #lists.isEmpty(products)}">
                      <p>Không có sản phẩm nào trong danh mục này.</p>
                  </div>
                </div>
            </div>
        </div>
      </div>
    </section>

    </th:block>
</body>
</html>
