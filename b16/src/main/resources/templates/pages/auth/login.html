<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/main}">
<body>
    <th:block layout:fragment="content">
        <section class="contact_section layout_padding">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-md-5 col-lg-4 offset-md-3 offset-lg-4">
                        <div class="form_container">
                            <div class="heading_container text-center mb-4">
                                <h2>Đăng nhập</h2>
                            </div>
                            <div th:if="${param.error}" class="alert alert-danger text-center">
                                Tên đăng nhập hoặc mật khẩu không đúng.
                            </div>
                            <div th:if="${param.logout}" class="alert alert-success text-center">
                                Bạn đã đăng xuất.
                            </div>
                            <form th:action="@{/dang-nhap}" method="post">
                                <div>
                                    <input type="text" name="username" placeholder="Tên đăng nhập" required />
                                </div>
                                <div>
                                    <input type="password" name="password" placeholder="Mật khẩu" required />
                                </div>
                                <div class="d-flex justify-content-center mt-3">
                                    <button type="submit" class="btn btn-dark w-100 py-2">ĐĂNG NHẬP</button>
                                </div>
                                <div class="text-center mt-3">
                                    <p>Chưa có tài khoản? <a th:href="@{/dang-ky}">Đăng ký ngay</a></p>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </th:block>
</body>
</html>
